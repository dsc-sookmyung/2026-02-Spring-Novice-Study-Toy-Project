<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>스터디 등록·수정 | GDGoC 스터디</title>
    <link rel="stylesheet" th:href="@{/css/study.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main>
    <div class="toolbar">
        <h1 th:text="${editing ? '스터디 수정' : '스터디 개설'}">스터디 개설</h1>
    </div>

    <!-- 수정일 때는 수정 URL, 등록일 때는 등록 URL 사용 -->
    <form aria-label="스터디 등록·수정"
          id="study-form"
          method="post"
          th:action="${editing} ? @{/studies/{id}/edit(id=${study.id})} : @{/studies}">
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">
        <div class="panel fields">
            <label for="title">제목</label>
            <input id="title" name="title"
                   th:value="${editing ? study.title : ''}"
                   placeholder="스터디 제목을 입력하세요." required>

            <label for="content">스터디 소개</label>
            <textarea id="content" name="content" rows="5"
                      th:text="${editing ? study.content : ''}"
                      placeholder="스터디에 대한 간단한 소개를 입력하세요."
                      required></textarea>

            <label for="capacity">모집 정원</label>
            <input id="capacity" name="capacity" type="number" min="1"
                   th:value="${editing ? study.capacity : ''}" required>

            <!-- 현재 모집 상태 유지 (수정 시에만 전송) -->
            <input th:if="${editing}" type="hidden"
                   name="recruitmentStatus"
                   th:value="${study.recruitmentStatus}">
        </div>

        <div class="actions">
            <a class="button" th:href="@{/studies}">취소</a>
            <button class="primary" type="submit"
                    th:text="${editing ? '수정하기' : '등록하기'}">
                등록하기
            </button>
        </div>
    </form>
</main>
</body>
</html>
