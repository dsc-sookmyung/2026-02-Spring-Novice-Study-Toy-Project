<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>스터디 등록·수정 | GDGoC 스터디</title>
    <link rel="stylesheet" th:href="@{/css/study.css}">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="">
    <div class="toolbar"><h1 th:text="${editing ? '스터디 수정' : '스터디 개설'}">스터디 개설</h1></div>
    <form aria-label="스터디 등록·수정" id="study-form" th:action="@{/studies}">
        <div class="panel fields">
            <label for="title">제목</label>
            <input id="title" name="title" placeholder="스터디 제목을 입력하세요." required>
            <label for="description">스터디 소개</label>
            <textarea id="description" name="description" rows="5" placeholder="스터디에 대한 간단한 소개를 입력하세요." required></textarea>
            <label for="capacity">모집 정원</label>
            <input id="capacity" name="capacity" type="number" min="2" required>
        </div>
        <div class="actions">
            <a class="button" th:href="@{/studies}">취소</a>
            <button class="primary" type="submit" th:text="${editing ? '수정하기' : '등록하기'}">등록하기</button>
        </div>
    </form>
</main>
<script>
    document.querySelector('#study-form').addEventListener('submit', event => {
        event.preventDefault();

        const body = JSON.stringify({
            title: document.getElementById('title').value,
            description: document.getElementById('description').value,
            capacity: Number(document.getElementById('capacity').value),
        });

        function success() {
            alert('등록 완료되었습니다.');
            location.replace('/studies');
        }

        function fail() {
            alert('등록 실패했습니다.');
            location.replace('/studies');
        }
        httpRequest("POST", "/api/studies", body, success, fail);
    });

    function httpRequest(method, url, body, success, fail) {
        const token = document.querySelector('meta[name="_csrf"]').content;
        const header = document.querySelector('meta[name="_csrf_header"]').content;

        fetch(url, {
            method: method,
            headers: { [header]: token, "Content-Type": "application/json" },
            body: body,
        }).then((response) => {
            if (response.ok) {
                return success();
            }
            return fail();
        });
    }
</script>
</body>
</html>
