<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>스터디 등록·수정 | GDGoC 스터디</title>
    <link rel="stylesheet" th:href="@{/css/study.css}">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main>
    <div class="toolbar">
        <h1 th:text="${editing ? '스터디 수정' : '스터디 개설'}">스터디 개설</h1>
    </div>
    <form aria-label="스터디 등록·수정" id="study-form"
          th:data-method="${editing ? 'PUT' : 'POST'}"
          th:data-url="${editing} ? @{/api/studies/{id}(id=${study.id})} : @{/api/studies}"
          th:data-list-url="@{/studies}">
        <div class="panel fields">
            <label for="title">제목</label>
            <input id="title" name="title" placeholder="스터디 제목을 입력하세요."
                   th:value="${editing ? study.title : ''}" required>

            <label for="description">스터디 소개</label>
            <textarea id="description" name="description" rows="5"
                      placeholder="스터디에 대한 간단한 소개를 입력하세요."
                      th:text="${editing ? study.description : ''}" required></textarea>

            <label for="capacity">모집 정원</label>
            <input id="capacity" name="capacity" type="number" min="2"
                   th:value="${editing ? study.capacity : ''}" required>
        </div>
        <div class="actions">
            <a class="button" th:href="@{/studies}">취소</a>
            <button class="primary" type="submit"
                    th:text="${editing ? '수정하기' : '등록하기'}">등록하기</button>
        </div>
    </form>
</main>

<script>
    const form = document.getElementById('study-form');

    form.addEventListener('submit', event => {
        event.preventDefault();

        const method = form.dataset.method;
        const action = method === 'PUT' ? '수정' : '등록';
        const token = document.querySelector('meta[name="_csrf"]').content;
        const header = document.querySelector('meta[name="_csrf_header"]').content;
        const body = JSON.stringify({
            title: document.getElementById('title').value,
            description: document.getElementById('description').value,
            capacity: Number(document.getElementById('capacity').value)
        });

        fetch(form.dataset.url, {
            method,
            headers: {
                [header]: token,
                'Content-Type': 'application/json'
            },
            body
        })
            .then(response => {
                if (!response.ok) {
                    alert(`${action}에 실패했습니다. (HTTP ${response.status})`);
                    return;
                }

                alert(`${action}이 완료되었습니다.`);
                location.replace(form.dataset.listUrl);
            })
            .catch(() => {
                alert('서버에 연결하지 못했습니다.');
            });
    });
</script>
</body>
</html>
