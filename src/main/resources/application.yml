spring:
  config:
    import: 'optional:file:.env[.properties]'
  datasource:
    url: jdbc:h2:file:./data/gdgoc
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
